<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

  :root {
    --sky:        #2b9fd4;
    --sky-dark:   #1a7aaa;
    --red:        #d63a2a;
    --red-light:  #e8523f;
    --yellow:     #f5c518;
    --yellow-deep:#d4a800;
    --green:      #4a9e3f;
    --bg:         #fdf8ef;
    --card-bg:    #ffffff;
    --text:       #1a2e1a;
    --text-mid:   #4a6b4a;
    --text-muted: #7a9a7a;
    --border-sky: rgba(43,159,212,0.25);
    --border-red: rgba(214,58,42,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 60px;
  }

  /* ── CIRCUS STRIPE BAR ── */
  .stripe-bar {
    height: 8px;
    background: repeating-linear-gradient(
      90deg,
      var(--red) 0px, var(--red) 20px,
      var(--yellow) 20px, var(--yellow) 40px
    );
  }

  /* ── HERO ── */
  .hero {
    padding: 52px 32px 40px;
    text-align: center;
    background: linear-gradient(180deg, #e4f4fb 0%, var(--bg) 100%);
    border-bottom: 1px solid rgba(43,159,212,0.12);
  }

  .title-org {
    font-size: 15px;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    margin-bottom: 16px;
    animation: fadeUp 0.6s ease both;
  }

  .title-main {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(38px, 10vw, 50px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: 0.06em;
    color: var(--red);
    margin-bottom: 10px;
    animation: fadeUp 0.6s 0.08s ease both;
    text-shadow: 2px 3px 0 rgba(214,58,42,0.1);
  }

  .title-en {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--sky-dark);
    font-weight: 400;
    margin-bottom: 6px;
    animation: fadeUp 0.6s 0.13s ease both;
  }

  .title-credits {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--green);
    font-weight: 500;
    margin-bottom: 30px;
    animation: fadeUp 0.6s 0.17s ease both;
  }

  .divider-line {
    width: 48px;
    height: 2px;
    background: linear-gradient(90deg, var(--red), var(--yellow));
    margin: 0 auto 26px;
    border-radius: 2px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  /* ── THREE STAT CARDS ── */
  .stats-row {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.6s 0.24s ease both;
  }

  .stat {
    flex: 1;
    text-align: center;
    padding: 16px 8px;
    background: var(--card-bg);
    border: 1.5px solid var(--border-sky);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(43,159,212,0.07);
  }

  .stat-num {
    font-family: 'Noto Serif TC', serif;
    font-size: 20px;
    font-weight: 900;
    color: var(--sky);
    display: block;
    line-height: 1;
    margin-bottom: 5px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  /* ── PROMO ── */
  .promo-banner {
    margin: 24px 24px 0;
    background: linear-gradient(135deg, #fffbde, #fff9e0);
    border: 1.5px solid rgba(245,197,24,0.5);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeUp 0.6s 0.29s ease both;
    box-shadow: 0 2px 10px rgba(245,197,24,0.12);
  }

  .promo-icon { font-size: 26px; flex-shrink: 0; }

  .promo-text strong {
    display: block;
    font-size: 14px;
    color: #7a5500;
    font-weight: 700;
  }

  /* ── SECTION LABEL ── */
  .section-label {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    margin: 38px 0 16px;
    animation: fadeUp 0.6s 0.33s ease both;
  }

  /* ── CARDS ── */
  .cards {
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: fadeUp 0.6s 0.37s ease both;
  }

  .card {
    background: var(--card-bg);
    border: 1.5px solid var(--border-red);
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    text-decoration: none;
    display: block;
    box-shadow: 0 3px 14px rgba(214,58,42,0.06);
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--red);
    box-shadow: 0 14px 40px rgba(214,58,42,0.13);
  }

  .card-stripe {
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      var(--red) 0px, var(--red) 16px,
      var(--yellow) 16px, var(--yellow) 32px
    );
  }

  .card-inner { padding: 22px 26px 22px; }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--sky);
    font-weight: 700;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(43,159,212,0.18);
    width: 100%;
  }

  /* Date: big numeral + day-of-week in brackets */
  .card-dates {
    font-family: 'Noto Serif TC', serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 14px;
    letter-spacing: 0.01em;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }

  .card-dates-day {
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* Venue enlarged to match date size */
  .card-venue {
    font-family: 'Noto Serif TC', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .card-venue-icon { font-size: 18px; opacity: 0.75; }

  .card-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--sky);
    color: #ffffff;
    border-radius: 12px;
    padding: 15px 22px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.08em;
    transition: background 0.2s ease;
  }

  .card:hover .card-btn { background: var(--sky-dark); }

  .card-btn-arrow {
    font-size: 20px;
    transition: transform 0.2s ease;
  }

  .card:hover .card-btn-arrow { transform: translateX(4px); }

  /* ── CREDITS ── */
  .credits {
    margin: 34px 24px 0;
    padding: 22px 26px;
    background: var(--card-bg);
    border: 1.5px solid var(--border-sky);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fadeUp 0.6s 0.43s ease both;
    box-shadow: 0 2px 10px rgba(43,159,212,0.05);
  }

  .credit-row { display: flex; align-items: baseline; }

  .credit-key {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 44px;
    flex-shrink: 0;
    letter-spacing: 0.05em;
  }

  .credit-sep {
    color: rgba(43,159,212,0.3);
    margin: 0 14px;
    font-size: 14px;
  }

  .credit-val {
    font-size: 17px;
    color: var(--text);
    font-weight: 700;
    font-family: 'Noto Serif TC', serif;
    letter-spacing: 0.04em;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    margin-top: 38px;
    padding: 0 24px;
    animation: fadeUp 0.6s 0.49s ease both;
  }

  .footer-divider {
    width: 36px;
    height: 2px;
    background: linear-gradient(90deg, var(--red), var(--yellow));
    margin: 0 auto 12px;
    border-radius: 2px;
  }

  .footer-logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .footer-note {
    font-size: 10px;
    color: #b0c8b0;
    letter-spacing: 0.05em;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stripe-bar"></div>

<div class="page-wrap">

  <div class="hero">
    <p class="title-org">FOCASA 馬戲團</p>
    <h1 class="title-main">幾米男孩的<br>100次勇敢</h1>
    <p class="title-en">One to One Hundred: A Brave Journey</p>
    <p class="title-credits">導演 林懷民 &nbsp;·&nbsp; 原著 幾米</p>
    <div class="divider-line"></div>
    <div class="stats-row">
      <div class="stat">
        <span class="stat-num">7萬+</span>
        <span class="stat-label">親子已同歡</span>
      </div>
      <div class="stat">
        <span class="stat-num">80分鐘</span>
        <span class="stat-label">馬戲演出</span>
      </div>
      <div class="stat">
        <span class="stat-num">3歲+</span>
        <span class="stat-label">建議年齡</span>
      </div>
    </div>
  </div>

  <div class="promo-banner">
    <div class="promo-icon">🎟️</div>
    <div class="promo-text">
      <strong>兒童票五折 · 最低五百元起</strong>
    </div>
  </div>

  <p class="section-label">選擇場館 · 立即購票</p>

  <div class="cards">

    <a class="card" id="btn-july" href="https://pse.is/tpadtotix7" target="_blank" rel="noopener">
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-tag">七月場</div>
        <div class="card-dates">
          7.17–26
          <span class="card-dates-day">（週五—週日）</span>
        </div>
        <div class="card-venue">
          <span class="card-venue-icon">📍</span>
          臺北表演藝術中心
        </div>
        <div class="card-btn">
          <span>立即購票</span>
          <span class="card-btn-arrow">→</span>
        </div>
      </div>
    </a>

    <a class="card" id="btn-aug" href="https://pse.is/tpadtotix8" target="_blank" rel="noopener">
      <div class="card-stripe"></div>
      <div class="card-inner">
        <div class="card-tag">八月場</div>
        <div class="card-dates">
          8.7–16
          <span class="card-dates-day">（週五—週日）</span>
        </div>
        <div class="card-venue">
          <span class="card-venue-icon">📍</span>
          臺北城市舞台
        </div>
        <div class="card-btn">
          <span>立即購票</span>
          <span class="card-btn-arrow">→</span>
        </div>
      </div>
    </a>

  </div>

  <div class="credits">
    <div class="credit-row">
      <span class="credit-key">導演</span>
      <span class="credit-sep">|</span>
      <span class="credit-val">林懷民</span>
    </div>
    <div class="credit-row">
      <span class="credit-key">原著</span>
      <span class="credit-sep">|</span>
      <span class="credit-val">幾米</span>
    </div>
    <div class="credit-row">
      <span class="credit-key">演出</span>
      <span class="credit-sep">|</span>
      <span class="credit-val">FOCASA 馬戲團</span>
    </div>
  </div>

  <div class="footer">
    <div class="footer-divider"></div>
    <div class="footer-logo">FOCASA馬戲團</div>
    <div class="footer-note">© 2026 FOCASA馬戲團. All rights reserved.</div>
  </div>

</div>

<div class="stripe-bar"></div>

<script>
  (function () {
    const urlParams = new URLSearchParams(window.location.search);
    const utmSource   = urlParams.get('utm_source')   || 'direct';
    const utmMedium   = urlParams.get('utm_medium')   || 'none';
    const utmCampaign = urlParams.get('utm_campaign') || 'focasa2025';

    function buildUTM(base, venue) {
      const sep = base.includes('?') ? '&' : '?';
      return `${base}${sep}utm_source=${utmSource}&utm_medium=${utmMedium}&utm_campaign=${utmCampaign}&utm_content=${venue}`;
    }

    const july = document.getElementById('btn-july');
    const aug  = document.getElementById('btn-aug');

    if (july) july.href = buildUTM('https://pse.is/tpadtotix7', 'taipei_july');
    if (aug)  aug.href  = buildUTM('https://pse.is/tpadtotix8', 'taipei_aug');

    [july, aug].forEach(function(btn) {
      if (!btn) return;
      btn.addEventListener('click', function () {
        var venue = btn.id === 'btn-july' ? '七月場_北藝中心' : '八月場_城市舞台';
        if (typeof fbq !== 'undefined') {
          fbq('track', 'InitiateCheckout', { content_name: venue });
        }
        if (typeof gtag !== 'undefined') {
          gtag('event', 'click_buy_ticket', { venue: venue });
        }
      });
    });
  })();
</script>

</body>
</html>
